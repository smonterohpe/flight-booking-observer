server {
    listen 80;
    server_name _;

    root /var/www/observability-console;
    index index.html;

    # ============ SPA estática ============
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ============ Backend de negocio (KPIs de reservas) ============
    # Sustituye BACKEND_HOST por la IP/hostname de la VM del backend.
    # "^~" da prioridad a este prefijo sobre el location por extensión
    # de arriba — sin esto, peticiones con extensión (poco probable aquí,
    # pero por consistencia) serían interceptadas por el bloque de estáticos.
    location ^~ /api/ {
        proxy_pass http://BACKEND_HOST:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ============ Frontend de negocio (ping HTTP para Systems) ============
    # Sustituye FRONTEND_HOST por la IP/hostname de la VM del frontend.
    # "^~" es CRÍTICO aquí: sin él, peticiones como /check/frontend/css/style.css
    # son interceptadas por el location de estáticos de arriba (por la
    # extensión .css) en vez de llegar al proxy, y NGINX intenta servir
    # ese fichero localmente -> 404, aunque el proxy en sí funcione bien.
    location ^~ /check/frontend/ {
        proxy_pass http://FRONTEND_HOST:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ============ sys-probe de la VM de frontend ============
    location ^~ /check/frontend-sys/ {
        proxy_pass http://FRONTEND_HOST:5001/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ============ db-probe de la VM de base de datos ============
    # Sustituye DATABASE_HOST por la IP/hostname de la VM de base de datos.
    location ^~ /check/db/ {
        proxy_pass http://DATABASE_HOST:5000/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ============ sys-probe de la VM de base de datos ============
    location ^~ /check/db-sys/ {
        proxy_pass http://DATABASE_HOST:5001/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ============ zerto-probe (corre en ESTA MISMA VM, puerto 5002) ============
    location ^~ /zerto/ {
        proxy_pass http://127.0.0.1:5002/zerto/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
